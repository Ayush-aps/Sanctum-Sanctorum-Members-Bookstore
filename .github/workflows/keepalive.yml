name: Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render from going to sleep
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual runs from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render and Keep Supabase Active
        run: |
          curl -s -f https://sanctum-sanctorum-56pb.onrender.com/health || echo "Ping failed"